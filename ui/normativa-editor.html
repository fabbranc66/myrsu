<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor normativa - MyRSU</title>
  <link rel="stylesheet" href="menu.css?v=20260719-mobile-menu-10">
  <link rel="stylesheet" href="users.css?v=20260728-mobile-permits-1">
  <link rel="stylesheet" href="practices.css?v=20260730-edit-1">
</head>
<body>
  <header class="app-header"><div><p class="eyebrow">Solo admin</p><h1>Editor normativa</h1></div><nav class="app-nav"></nav></header>
  <main>
    <section class="panel">
      <header><div><h1>Modifica testi Normativa Rapida</h1><p class="muted">Modifica completa dei file sorgente usati da MyRSU.</p></div></header>
      <form id="normativaForm" class="grid">
        <label class="wide">File normativa<select name="source_path" required></select></label>
        <label class="wide">Testo<textarea name="content" rows="24" required></textarea></label>
        <button type="button" id="loadNormativa">Carica</button>
        <button type="submit">Salva</button>
      </form>
      <pre id="message"></pre>
      <pre id="jsonOutput" class="json-output"></pre>
    </section>
  </main>
  <script src="normativa-editor.js?v=20260730-1"></script>
  <script src="auth-menu.js?v=20260730-normativa-1"></script>
</body>
</html>
