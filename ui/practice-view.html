<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyRSU Scheda pratica</title>
  <link rel="stylesheet" href="menu.css?v=20260719-mobile-menu-10"><link rel="stylesheet" href="users.css?v=20260802-pdf-verify-button-1"><link rel="stylesheet" href="practices.css?v=20260802-search-toolbar-1">
</head>
<body>
  <header class="app-header"><div><p class="eyebrow">MyRSU</p><h1>Scheda pratica</h1></div><nav class="app-nav"></nav></header>
  <main><section class="panel">
    <div class="practice-view-grid">
      <section class="practice-card">
        <header><h2>Modifica pratica</h2><a class="button" href="practices.html">Torna alle pratiche</a></header>
        <form id="practiceEditForm" class="practice-form">
          <label class="wide">Titolo<input name="title" maxlength="255" required></label>
          <label class="wide">Sintesi pratica<textarea name="summary" rows="7"></textarea></label>
          <label>Tipo<select name="type"></select></label><label>Stato<select name="status"></select></label>
          <label>Priorità<select name="priority"></select></label><label>Origine<select name="source_type"></select></label>
          <label>Assegnata a<select name="assigned_user_id"></select></label><label>Visibilità<select name="visibility"></select></label>
          <label>Scadenza<input name="due_date" type="date"></label><div class="wide"><button type="submit">Salva pratica</button></div>
        </form>
        <h2>Nota operativa</h2>
        <form id="practiceNoteForm"><label>Testo<textarea name="body" rows="4" required></textarea></label><button type="submit">Aggiungi nota</button></form>
        <div class="practice-tools"><button id="openCcnlModal" type="button">Normativa rapida</button></div>
      </section>
      <section class="practice-card"><h2>Timeline cronologica</h2><div id="practiceTimeline" class="practice-timeline"></div></section>
    </div>
    <dialog id="documentModal" class="preview-modal">
      <header>
        <h2>Documento</h2>
        <div id="pdfToolbar" class="pdf-toolbar hidden"><span id="pdfZoomValue">100%</span></div>
        <button id="closeDocumentModal" type="button">Chiudi</button>
      </header>
      <iframe id="documentPreview" title="Anteprima documento"></iframe>
      <div id="pdfCanvasViewer" class="pdf-canvas-viewer hidden"></div>
    </dialog>
    <dialog id="verifyFrameModal" class="preview-modal">
      <header><h2>Verifica autenticità</h2><button id="closeVerifyFrameModal" type="button">Chiudi</button></header>
      <iframe id="verifyFrame" title="Verifica autenticità"></iframe>
    </dialog>
    <dialog id="ccnlModal" class="preview-modal ccnl-practice-modal">
      <header><h2>Normativa rapida</h2><div class="modal-actions"><span id="ccnlSelectionCount" class="ccnl-selection-count" hidden>0 caratteri</span><button id="ccnlHeaderLink" type="button" hidden>Collega alla pratica</button><button id="closeCcnlModal" type="button">Chiudi</button></div></header>
      <div class="ccnl-search-toolbar">
        <label class="ccnl-scope-row">Ambito ricerca
          <select id="ccnlScopeSelect">
            <option value="all">Tutte le normative</option>
            <option value="ccnl">CCNL</option>
            <option value="representation">Testo Unico Rappresentanza</option>
            <option value="safety">Sicurezza 81/08</option>
          </select>
        </label>
        <div class="ccnl-search-row">
          <input id="ccnlSearchInput" placeholder="Cerca nel CCNL">
          <button id="ccnlQuestionToggle" class="hidden" type="button">Domanda Codex</button>
          <button id="ccnlResetVocabulary" type="button">Reset termini</button>
          <button id="ccnlClearSearch" type="button">Pulisci</button>
        </div>
      </div>
      <form id="ccnlQuestionForm" class="ccnl-question-form hidden">
        <label>Domanda<textarea name="question" rows="3" placeholder="Es. Il RLS può chiedere copia del DVR?"></textarea></label>
        <button type="submit">Cerca risposta</button>
      </form>
      <div id="ccnlQuestionAnswer" class="ccnl-question-answer hidden"></div>
      <div id="ccnlResults" class="ccnl-results"></div>
      <div id="ccnlSectionView" class="ccnl-section-view"></div>
      <form id="ccnlEditForm" class="ccnl-edit-form hidden">
        <input name="source_path" type="hidden">
        <textarea name="content" rows="16"></textarea>
        <div><button type="submit">Salva testo</button><button id="ccnlCancelEdit" type="button">Annulla</button></div>
      </form>
    </dialog>
    <dialog id="ccnlViewModal" class="preview-modal ccnl-practice-modal">
      <header><h2>Riferimento normativo</h2><button id="closeCcnlViewModal" type="button">Chiudi</button></header>
      <div id="ccnlLinkedView" class="ccnl-section-view"></div>
    </dialog>
    <pre id="message"></pre><pre id="jsonOutput" class="json-output"></pre>
  </section></main>
  <script src="icons.js?v=20260719-icons-1"></script><script src="practice-options.js?v=20260628-1"></script><script src="practice-view.js?v=20260802-practice-verify-button-1"></script><script src="normativa-vocabulary.js?v=20260731-normativa-2"></script><script src="ccnl-practice.js?v=20260802-selection-count-2"></script><script src="ccnl-question.js?v=20260731-normativa-2"></script><script src="auth-menu.js?v=20260730-normativa-1"></script>
</body>
</html>
