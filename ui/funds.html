<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyRSU Fondi</title>
  <link rel="stylesheet" href="menu.css?v=20260719-mobile-menu-10">
  <link rel="stylesheet" href="users.css?v=20260627-1">
  <link rel="stylesheet" href="funds.css?v=20260727-collapsible-1">
</head>
<body>
  <header class="app-header"><div><p class="eyebrow">MyRSU</p><h1>Fondi</h1></div><nav class="app-nav"></nav></header>
  <main>
    <section class="panel">
      <header><div><h1>Fondi distributori automatici</h1><p class="muted">Contratto, entrate, uscite e saldo.</p></div></header>
      <div id="fundsSummary" class="funds-summary"></div>

      <section class="fund-section collapsible collapsed">
        <h2><button class="section-toggle" type="button">Contratto distributori</button></h2>
        <div class="section-body">
        <form id="contractForm" class="fund-form">
          <input type="hidden" name="id">
          <label>Fornitore<input name="supplier_name" required></label>
          <label>Numero contratto<input name="contract_number"></label>
          <label>Stato<select name="status"><option value="active">attivo</option><option value="expired">scaduto</option><option value="closed">chiuso</option></select></label>
          <label>Inizio<input name="start_date" type="date" required></label>
          <label>Fine<input name="end_date" type="date"></label>
          <label>Contratto PDF<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.txt,.doc,.docx,.xls,.xlsx"></label>
          <input name="document_id" type="hidden">
          <label class="wide">Note<textarea name="notes" rows="3"></textarea></label>
          <div class="wide"><button type="submit">Salva contratto</button><button id="resetContract" type="button">Nuovo</button></div>
        </form>
        <table><thead><tr><th>Fornitore</th><th>Contratto</th><th>Periodo</th><th>Stato</th><th>Documento</th><th>Azioni</th></tr></thead><tbody id="contractsTable"></tbody></table>
        </div>
      </section>

      <section class="fund-section collapsible collapsed">
        <h2><button class="section-toggle" type="button">Estratto conto fondi RSU</button></h2>
        <div class="section-body">
        <form id="statementForm" class="fund-form">
          <label>Data estratto<input name="statement_date" type="date" required></label>
          <label>Saldo estratto<input name="statement_balance" type="number" step="0.01" required></label>
          <label>Documento estratto<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.txt,.doc,.docx,.xls,.xlsx" required></label>
          <input name="document_id" type="hidden">
          <div><button type="submit">Carica e riconcilia</button></div>
        </form>
        <div id="statementResult" class="reconciliation-box hidden"></div>
        <form id="reconciliationForm" class="fund-form hidden">
          <label>Data voce<input name="movement_date" type="date" required></label>
          <label>Importo<input name="amount" type="number" step="0.01" min="0.01" required></label>
          <label class="wide">Causale<input name="reason" value="spese gestione conto" required></label>
          <div class="wide"><button type="submit">Registra voce contabile</button></div>
        </form>
        </div>
      </section>

      <section class="fund-section">
        <h2>Movimenti fondi</h2>
        <form id="movementForm" class="fund-form">
          <input type="hidden" name="id">
          <label>Contratto entrata<select name="contract_id"><option value="">-</option></select></label>
          <label>Data<input name="movement_date" type="date" required></label>
          <label>Tipo<select name="movement_type"><option value="income">entrata</option><option value="expense">uscita</option></select></label>
          <label>Importo<input name="amount" type="number" step="0.01" min="0.01" required></label>
          <label class="wide">Causale<input name="reason" required></label>
          <label>Documento movimento<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.txt,.doc,.docx,.xls,.xlsx"></label>
          <input name="document_id" type="hidden">
          <label class="wide">Note<textarea name="notes" rows="3"></textarea></label>
          <div class="wide"><button type="submit">Salva movimento</button><button id="resetMovement" type="button">Nuovo</button></div>
        </form>
        <table><thead><tr><th>Data</th><th>Tipo</th><th>Importo</th><th>Causale</th><th>Riferimento</th><th>Documento</th><th>Azioni</th></tr></thead><tbody id="movementsTable"></tbody></table>
      </section>

      <dialog id="documentModal" class="preview-modal">
        <header><h2>Documento contratto</h2><button id="closeDocumentModal" type="button">Chiudi</button></header>
        <iframe id="documentPreview" title="Anteprima documento"></iframe>
      </dialog>
      <pre id="message"></pre>
      <pre id="jsonOutput" class="json-output"></pre>
    </section>
  </main>
  <script src="vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="pdf-rasterizer.js?v=20260627-1"></script>
  <script src="icons.js?v=20260719-icons-1"></script>
  <script src="funds.js?v=20260727-collapsible-1"></script>
  <script src="auth-menu.js?v=20260727-funds-1"></script>
</body>
</html>
